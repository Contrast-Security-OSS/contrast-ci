name: Contrast CI

on:
  workflow_call:
    inputs:
      # --- Contrast Platform (required) ---
      api_host:
        required: true
        type: string
        description: Contrast Platform base API URL
      contrast_org_id:
        required: true
        type: string
        description: Contrast organization UUID

      # --- Contrast Platform (optional override) ---
      contrast_application_id:
        required: false
        type: string
        default: ''
        description: Manual override for the Contrast application UUID (skips auto-detection)
      triage_duration:
        required: false
        type: string
        default: '1m'
        description: Duration to run the contrast-triage tool (e.g. '1m', '5m').

      # --- Repo Context (required) ---
      base_branch:
        required: true
        type: string
        description: Default branch of the repository
      repo_url:
        required: true
        type: string
        description: GitHub repository URL
      repo_name:
        required: true
        type: string
        description: Repository full name (owner/repo)

      # --- SmartFix Config ---
      coding_agent:
        description: 'Specifies the coding agent to use for generating fixes. Allowed values: SMARTFIX, GITHUB_COPILOT, CLAUDE_CODE.'
        type: string
        required: false
        default: 'SMARTFIX'
      build_command:
        description: 'Build command to run before SmartFix'
        type: string
        default: 'echo No build command specified.'
      formatting_command:
        description: 'Format command to run before SmartFix'
        type: string
        default: ''
      max_open_prs:
        description: 'Maximum number of open PRs SmartFix will open'
        type: string
        default: '5'
      enable_full_telemetry:
        description: 'Enable SmartFix full telemetry for debugging'
        type: string
        default: 'true'
      debug_mode:
        description: 'Enable SmartFix debug mode for verbose logging'
        type: string
        default: 'false'

      # --- LLM Config ---
      use_contrast_llm:
        description: "Indicates to use Contrast internal LLM"
        type: string
        default: 'false'
      agent_model:
        description: 'The provider LLM model to use'
        type: string
        default: ''
      azure_api_base:
        description: 'The Azure API base URL'
        type: string
        default: ''
      azure_api_version:
        description: 'The Azure API version'
        type: string
        default: ''
      use_aws_creds_action:
        description: 'Whether to use configure AWS credentials action'
        type: string
        default: 'false'
      aws_region:
        description: 'The AWS region for Bedrock LLM'
        type: string
        default: ''

      # --- Runner ---
      github_runner:
        description: 'The GitHub runner to use (example: ubuntu-latest)'
        type: string
        default: 'ubuntu-latest'

    secrets:
      CONTRAST_API_KEY:
        description: The contrast API key
        required: true
      CONTRAST_AUTHORIZATION:
        description: The contrast authorization key
        required: true
      GH_TOKEN:
        description: The GitHub token
        required: true
      ANTHROPIC_API_KEY:
        description: The Anthropic API key
        required: false
      GEMINI_API_KEY:
        description: The Google Gemini API key
        required: false
      AZURE_API_KEY:
        description: The Azure API key
        required: false
      AWS_BEARER_TOKEN_BEDROCK:
        description: The AWS Bedrock API key
        required: false
      AWS_ROLE_TO_ASSUME:
        description: The AWS role to assume
        required: false
      AWS_ACCESS_KEY_ID:
        description: The AWS access key id
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: The AWS secret access key
        required: false
      AWS_SESSION_TOKEN:
        description: The AWS session token
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:

  # ─────────────────────────────────────────────────────────────────────
  # JOB 1: Get Repository Config
  # Fetches enabled features for this repo from the Contrast backend.
  # All downstream jobs gate on these outputs.
  # ─────────────────────────────────────────────────────────────────────
  get-repo-config:
    name: Get Repository Config
    runs-on: ${{ inputs.github_runner }}
    outputs:
      sast_enabled:      ${{ steps.fetch-config.outputs.sast_enabled }}
      sca_enabled:       ${{ steps.fetch-config.outputs.sca_enabled }}
      smartfix_enabled:  ${{ steps.fetch-config.outputs.smartfix_enabled }}
      ai_triage_enabled: ${{ steps.fetch-config.outputs.ai_triage_enabled }}
    steps:
      - name: Fetch Repository Config
        id: fetch-config
        env:
          API_HOST:               ${{ inputs.api_host }}
          ORG_ID:                 ${{ inputs.contrast_org_id }}
          REPO_URL:               ${{ inputs.repo_url }}/${{ inputs.repo_name }}
          CONTRAST_API_KEY:       ${{ secrets.CONTRAST_API_KEY }}
          CONTRAST_AUTHORIZATION: ${{ secrets.CONTRAST_AUTHORIZATION }}
        run: |
          HTTP_CODE=$(curl -s -G \
            --data-urlencode "repositoryUrl=${REPO_URL}" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -o /tmp/repo_config.json \
            -w "%{http_code}" \
            -H "API-Key: ${CONTRAST_API_KEY}" \
            -H "Authorization: ${CONTRAST_AUTHORIZATION}" \
            "${API_HOST}/api/entities/v1/organizations/${ORG_ID}/repositories/config")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch repository config from Contrast API (HTTP ${HTTP_CODE})."
            echo "::error::URL: ${API_HOST}/api/entities/v1/organizations/${ORG_ID}/repositories/config?repositoryUrl=${REPO_URL}"
            echo "::error::Response: $(cat /tmp/repo_config.json)"
            exit 1
          fi

          SAST_ENABLED=$(jq -r '.sastEnabled'        /tmp/repo_config.json)
          SCA_ENABLED=$(jq -r '.scaEnabled'          /tmp/repo_config.json)
          SMARTFIX_ENABLED=$(jq -r '.smartfixEnabled'   /tmp/repo_config.json)
          AI_TRIAGE_ENABLED=$(jq -r '.aiTriageEnabled'  /tmp/repo_config.json)

          echo "sast_enabled=${SAST_ENABLED}"           >> "$GITHUB_OUTPUT"
          echo "sca_enabled=${SCA_ENABLED}"             >> "$GITHUB_OUTPUT"
          echo "smartfix_enabled=${SMARTFIX_ENABLED}"   >> "$GITHUB_OUTPUT"
          echo "ai_triage_enabled=${AI_TRIAGE_ENABLED}" >> "$GITHUB_OUTPUT"

          echo "Repository Config:"
          echo "  SAST Enabled:      ${SAST_ENABLED}"
          echo "  SCA Enabled:       ${SCA_ENABLED}"
          echo "  SmartFix Enabled:  ${SMARTFIX_ENABLED}"
          echo "  AI Triage Enabled: ${AI_TRIAGE_ENABLED}"

  # ─────────────────────────────────────────────────────────────────────
  # JOB 2: Detect Modules via Contrast Recon
  # Runs contrast-recon to discover repository modules and outputs the
  # manifest for the resolver job.
  # ─────────────────────────────────────────────────────────────────────
  contrast-recon:
    name: Detect Modules
    needs: get-repo-config
    if: |
      (
        needs.get-repo-config.outputs.sast_enabled == 'true' ||
        needs.get-repo-config.outputs.sca_enabled == 'true' ||
        needs.get-repo-config.outputs.smartfix_enabled == 'true'
      ) &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' && github.event.action == 'closed' &&
          (
            contains(github.event.pull_request.head.ref, 'smartfix/remediation-') ||
            contains(github.event.pull_request.head.ref, 'copilot/fix-') ||
            contains(github.event.pull_request.head.ref, 'claude/issue-')
          )
        )
      )
    runs-on: ${{ inputs.github_runner }}
    outputs:
      contrast_ci_manifest: ${{ steps.recon.outputs.contrast_ci_manifest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Contrast Recon
        id: recon
        env:
          CONTRAST_HOST_NAME: ${{ inputs.api_host }}
          CONTRAST_ORG_ID: ${{ inputs.contrast_org_id }}
          CONTRAST_API_KEY: ${{ secrets.CONTRAST_API_KEY }}
          CONTRAST_AUTH_TOKEN: ${{ secrets.CONTRAST_AUTHORIZATION }}
          GITHUB_DEFAULT_BRANCH: ${{ inputs.base_branch }}
          GITHUB_REPOSITORY: ${{ inputs.repo_name }}
          GITHUB_SERVER_URL: ${{ inputs.repo_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          CONTRAST_CI_MANIFEST=$(docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CONTRAST_HOST_NAME \
            -e CONTRAST_ORG_ID \
            -e CONTRAST_API_KEY \
            -e CONTRAST_AUTH_TOKEN \
            -e GITHUB_DEFAULT_BRANCH \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SERVER_URL \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_RUN_ID \
            -e GITHUB_WORKFLOW \
            -v "${{ github.workspace }}:/workspace" \
            contrast/contrast-recon:latest /workspace)

          echo "Recon output:"
          echo "$CONTRAST_CI_MANIFEST" | jq .

          echo "contrast_ci_manifest<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTRAST_CI_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # JOB 3: Resolve Applications via Contrast Resolver
  # Pipes the recon manifest to contrast-resolver to resolve modules to
  # Contrast application IDs.
  # ─────────────────────────────────────────────────────────────────────
  contrast-resolve:
    name: Resolve Applications
    needs: contrast-recon
    runs-on: ${{ inputs.github_runner }}
    outputs:
      contrast_ci_manifest: ${{ steps.set-outputs.outputs.contrast_ci_manifest }}
      contrast_app_ids:     ${{ steps.set-outputs.outputs.contrast_app_ids }}
      contrast_app_name:    ${{ steps.set-outputs.outputs.contrast_app_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        if: ${{ inputs.use_aws_creds_action == 'true' && inputs.aws_region != '' }}
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          output-credentials: true
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume:        ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Run Contrast Resolver
        id: resolve
        env:
          CONTRAST_HOST_NAME: ${{ inputs.api_host }}
          CONTRAST_ORG_ID: ${{ inputs.contrast_org_id }}
          CONTRAST_API_KEY: ${{ secrets.CONTRAST_API_KEY }}
          CONTRAST_AUTH_TOKEN: ${{ secrets.CONTRAST_AUTHORIZATION }}
          GITHUB_DEFAULT_BRANCH: ${{ inputs.base_branch }}
          GITHUB_REPOSITORY: ${{ inputs.repo_name }}
          GITHUB_SERVER_URL: ${{ inputs.repo_url }}
        run: |
          CONTRAST_CI_MANIFEST=$(echo '${{ needs.contrast-recon.outputs.contrast_ci_manifest }}' | \
          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            -e CONTRAST_HOST_NAME \
            -e CONTRAST_ORG_ID \
            -e CONTRAST_API_KEY \
            -e CONTRAST_AUTH_TOKEN \
            -e GITHUB_DEFAULT_BRANCH \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SERVER_URL \
            -e GITHUB_ENV="$GITHUB_ENV" \
            -v "$(dirname $GITHUB_ENV):$(dirname $GITHUB_ENV)" \
            --entrypoint contrast-resolver \
            contrast/contrast-recon:latest)

          echo "Resolver output:"
          echo "$CONTRAST_CI_MANIFEST" | jq .

          # Write manifest to step output so set-outputs can read it
          echo "contrast_ci_manifest<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTRAST_CI_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set Contrast Application Data Outputs
        id: set-outputs
        shell: bash
        env:
          CONTRAST_CI_MANIFEST: ${{ steps.resolve.outputs.contrast_ci_manifest }}
        run: |
          # Write manifest to job output using heredoc delimiter
          echo "contrast_ci_manifest<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTRAST_CI_MANIFEST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # CONTRAST_APP_IDS is written to $GITHUB_ENV by the resolver container,
          # pipe this to $$GITHUB_OUTPUT for use in later jobs
          if [[ -n "$CONTRAST_APP_IDS" && "$CONTRAST_APP_IDS" != "null" ]]; then
            echo "contrast_app_ids=$CONTRAST_APP_IDS" >> $GITHUB_OUTPUT
            echo "Resolved CONTRAST_APP_IDS: $CONTRAST_APP_IDS"
          else
            echo "::warning::Resolver did not write CONTRAST_APP_IDS to GITHUB_ENV"
          fi

          # Extract first app name from resolver manifest for SAST backward compat
          APP_NAME=$(echo "$CONTRAST_CI_MANIFEST" | jq -r '[.resolutions[] | select(.appId != null)] | first | .appName // empty')
          if [[ -n "$APP_NAME" ]]; then
            echo "contrast_app_name=$APP_NAME" >> $GITHUB_OUTPUT
            echo "Resolved application name: $APP_NAME"
          fi

      - name: Warn if Application ID Not Found
        if: ${{ steps.set-outputs.outputs.contrast_app_ids == '' && inputs.contrast_application_id == '' }}
        shell: bash
        run: |
          MSG="Contrast application ID could not be automatically detected for repository '${{ inputs.repo_name }}'."
          MSG="${MSG} SmartFix will be skipped."
          MSG="${MSG}%0A%0ATo set the application ID manually, add 'contrast_application_id' to your workflow inputs:"
          MSG="${MSG}%0A  1. Browse your applications:"
          MSG="${MSG}%0A     ${{ inputs.api_host }}/Contrast/static/ng/index.html#/${{ inputs.contrast_org_id }}/applications"
          MSG="${MSG}%0A  2. Select your application"
          MSG="${MSG}%0A  3. The ID is the UUID after applications/ in the URL"
          MSG="${MSG}%0A     e.g. applications/057254e6-f065-40fa-8197-e1d7ace10e67"
          echo "::warning::${MSG}"

  # ─────────────────────────────────────────────────────────────────────
  # JOB 4: Run Contrast Code Scanner
  # Skipped if sastEnabled is false in the repository config.
  # ─────────────────────────────────────────────────────────────────────
  run-contrast-code:
    name: Code - SAST
    needs:
      - contrast-resolve
      - get-repo-config
    if: |
      needs.get-repo-config.outputs.sast_enabled == 'true' &&
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.base_branch))
    runs-on: ${{ inputs.github_runner }}
    steps:
      - name: Configure AWS Credentials
        if: ${{ inputs.use_aws_creds_action == 'true' && inputs.aws_region != '' }}
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume:        ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Branch Name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Run Contrast Code Scanner
        uses: docker://contrast/sast-smartai
        env:
          CONTRAST_CI_MANIFEST: ${{ needs.contrast-resolve.outputs.contrast_ci_manifest }}
          LOGLEVEL: ${{ runner.debug == '1' && 'DEBUG' || 'INFO' }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_HTTP_URL: ${{ inputs.repo_url }}/${{ inputs.repo_name }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          DEFAULT_BRANCH: ${{ inputs.base_branch }}
          COMMIT_HASH: ${{ github.sha }}
          COMMITTER: ${{ github.triggering_actor }}
          TAG: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_ID: ${{ github.workflow_sha }}
          CONTRAST_BASE_URL: ${{ inputs.api_host }}
          CONTRAST_ORG_ID: ${{ inputs.contrast_org_id }}
          CONTRAST_API_KEY: ${{ secrets.CONTRAST_API_KEY }}
          CONTRAST_AUTHORIZATION: ${{ secrets.CONTRAST_AUTHORIZATION }}
          RUN_TRIAGE: ${{ needs.get-repo-config.outputs.ai_triage_enabled }}
          TRIAGE_DURATION: ${{ inputs.triage_duration }}
          APPLICATION_DIR: ${{ github.workspace }}

  # ─────────────────────────────────────────────────────────────────────
  # JOB 5: Run Contrast SCA
  # SCA dependency scanning. Skipped if scaEnabled is false in the repository config.
  # ─────────────────────────────────────────────────────────────────────
  run-sca:
    name: Code - Static SCA
    needs:
      - contrast-resolve
      - get-repo-config
    if: |
      needs.get-repo-config.outputs.sca_enabled == 'true' &&
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.base_branch))
    runs-on: ${{ inputs.github_runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Contrast Code Static SCA Scanner
        env:
          CONTRAST_CI_MANIFEST: ${{ needs.contrast-resolve.outputs.contrast_ci_manifest }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/var/app:rw \
            -v /tmp:/tmp:rw \
            -e CONTRAST_CI_MANIFEST \
            -e GITHUB_TOKEN=${{ secrets.GH_TOKEN }} \
            -e CDXGEN_DEBUG_MODE=true \
            contrast/sca-smartai:latest \
            scan /var/app --output /tmp/sbom.json --debug /tmp/sbom.debug

      - name: Archive SBOM results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-output
          path: /tmp/sbom*

      - name: Upload SBOM to Contrast
        run: |
          ls -la /tmp/sbom.json
          curl -v -X POST "${{ inputs.api_host }}/api/sca/v1/organizations/${{ inputs.contrast_org_id }}/sbom" \
            -H "API-Key: ${{ secrets.CONTRAST_API_KEY }}" \
            -H "Authorization: ${{ secrets.CONTRAST_AUTHORIZATION }}" \
            -F "file=@/tmp/sbom.json;type=application/json"

  # ─────────────────────────────────────────────────────────────────────
  # JOB 6: Run Contrast SmartFix
  # AI-powered fix PR generation. Event-gated — only runs on:
  #   • pull_request (closed) — handles merge notification or PR close
  #   • workflow_dispatch     — manual trigger to generate fixes
  #   • schedule              — scheduled fix generation
  # Does NOT run on PR open/synchronize to avoid redundant runs.
  # ─────────────────────────────────────────────────────────────────────
  run-smartfix:
    name: SmartFix
    needs:
      - contrast-resolve
      - get-repo-config
    if: |
      needs.get-repo-config.outputs.smartfix_enabled == 'true' &&
      (needs.contrast-resolve.outputs.contrast_app_ids != '' || inputs.contrast_application_id != '') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'pull_request' && github.event.action == 'closed' &&
          (
            contains(github.event.pull_request.head.ref, 'smartfix/remediation-') ||
            contains(github.event.pull_request.head.ref, 'copilot/fix-') ||
            contains(github.event.pull_request.head.ref, 'claude/issue-')
          )
        )
      )
    runs-on: ${{ inputs.github_runner }}
    steps:
      - name: Determine SmartFix Job Type
        id: job_type
        run: |
          if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "label=Notify Contrast on PR Merge" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.merged }}" == "false" ]]; then
            echo "label=Handle PR Close" >> $GITHUB_OUTPUT
          else
            echo "label=Run Contrast AI SmartFix - Generate Fixes" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: ${{ inputs.use_aws_creds_action == 'true' && inputs.aws_region != '' }}
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          output-env-credentials: true
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume:        ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:            ${{ inputs.aws_region }}

      - name: ${{ steps.job_type.outputs.label }}
        uses: Contrast-Security-OSS/contrast-ai-smartfix-action@v1
        with:
          aws_region:                 ${{ inputs.aws_region }}
          contrast_host:              ${{ inputs.api_host }}
          contrast_org_id:            ${{ inputs.contrast_org_id }}
          contrast_app_id:            ${{ inputs.contrast_application_id }}
          contrast_app_ids:           ${{ needs.contrast-resolve.outputs.contrast_app_ids }}
          base_branch:                ${{ inputs.base_branch }}
          build_command:              ${{ inputs.build_command }}
          formatting_command:         ${{ inputs.formatting_command }}
          use_contrast_llm:           ${{ inputs.use_contrast_llm }}
          max_open_prs:               ${{ inputs.max_open_prs }}
          agent_model:                ${{ inputs.agent_model }}
          azure_api_base:             ${{ inputs.azure_api_base }}
          azure_api_version:          ${{ inputs.azure_api_version }}
          enable_full_telemetry:      ${{ inputs.enable_full_telemetry }}
          debug_mode:                 ${{ runner.debug == '1' && 'true' || inputs.debug_mode }}
          coding_agent:               ${{ inputs.coding_agent }}
          contrast_api_key:           ${{ secrets.CONTRAST_API_KEY }}
          contrast_authorization_key: ${{ secrets.CONTRAST_AUTHORIZATION }}
          github_token:               ${{ secrets.GH_TOKEN }}
          gemini_api_key:             ${{ secrets.GEMINI_API_KEY }}
          anthropic_api_key:          ${{ secrets.ANTHROPIC_API_KEY }}
          azure_api_key:              ${{ secrets.AZURE_API_KEY }}
          aws_bearer_token_bedrock:   ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
